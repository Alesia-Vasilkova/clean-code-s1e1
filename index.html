<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link 
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
     >
  </head>
  <body class="page-content">
    <header class="todo-header">
      <img class="todo-header-img" src="./eisenhower-matrix.jpg" alt="matrix">
      <a
        class="todo-header_text"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="centered-main-page_element">
      <section id="add-task-section">
        <h1 class="new-task-label task-label">Add Item</h1>
        <div class="task-row-wrapper">
          <input
            id="new-task-input"
            class="task all-inputs text-input"
            type="text"
          >
          <button class="btn" id="add-btn">Add</button>
        </div>
      </section>
      <h1 class="todo-heading">Todo</h1>
      <ul id="incomplete-tasks" class="task-ul">
        <li class="task-li">
          <input type="checkbox" class="all-inputs checkbox-input">
          <label class="task task-label">Pay Bills</label>
          <input type="text" class="task all-inputs text-input hiden">
          <button class="edit-save btn">Edit</button>
          <button class="delete btn">
            <img class="delete-icon" src="./remove.svg" alt="delete">
          </button>
        </li>
        <li class="task-li">
          <input type="checkbox" class="all-inputs checkbox-input">
          <label class="task task-label">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="task all-inputs text-input hiden"
          >
          <button class="edit-save btn">Edit</button>
          <button class="delete btn">
            <img class="delete-icon" src="./remove.svg" alt="delete">
          </button>
        </li>
      </ul>
      <h1 class="todo-heading">Completed</h1>
      <ul id="complete-tasks" class="task-ul">
        <li class="task-li">
          <input type="checkbox" class="all-inputs checkbox-input" checked>
          <label class="task complete-task-label task-label">See the Doctor</label>
          <input type="text" class="task all-inputs text-input hiden">
          <button class="edit-save btn">Edit</button>
          <button class="delete btn">
            <img class="delete-icon" src="./remove.svg" alt="delete">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
