<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link 
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body class="page-content">
    <div class="todo-header">
      <img src="./eisenhower-matrix.jpg">
      <a
        class="todo-header_text"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </div>
    <div class="centered-main-page_element">
      <p id="add-task-section">
        <label for="new-task-input" class="new-task-label task-label">Add Item</label>
        <div class="task-row-wrapper">
          <input
            id="new-task-input"
            class="task all-inputs text-input"
            type="text"
          >
          <button class="btn">Add</button>
        </div>
      </p>
      <h3 class="todo-heading">Todo</h3>
      <ul id="incomplete-tasks" class="task-ul">
        <li class="task-li">
          <input type="checkbox" class="all-inputs checkbox-input">
          <label class="task task-label">Pay Bills</label>
          <input type="text" class="task all-inputs text-input hiden">
          <button class="edit-save btn">Edit</button>
          <button class="delete btn">
            <img class="delete-icon" src="./remove.svg">
          </button>
        </li>
        <li class="edit-mode task-li">
          <input type="checkbox" class="all-inputs checkbox-input">
          <label class="task hiden task-label">Go Shopping</label>
          <input
            type="text"
            value="Go Shopping"
            class="task all-inputs text-input"
          >
          <button class="edit-save btn">Save</button>
          <button class="delete btn">
            <img class="delete-icon" src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="todo-heading">Completed</h3>
      <ul id="complete-tasks" class="task-ul">
        <li class="task-li">
          <input type="checkbox" class="all-inputs checkbox-input" checked>
          <label class="task complete-task-label task-label">See the Doctor</label>
          <input type="text" class="task all-inputs text-input hiden">
          <button class="edit-save btn">Edit</button>
          <button class="delete btn">
            <img class="delete-icon" src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
